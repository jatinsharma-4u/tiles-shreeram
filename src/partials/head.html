<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<meta name="theme-color" content="#F7F2E9">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Hari Traders">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{ogImage}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{ogImage}}">
<style>html{background:#f7f2e9}body{visibility:hidden}</style>
<noscript><style>body{visibility:visible}</style></noscript>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>
  document.documentElement.classList.add('js');
  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    document.documentElement.classList.add('motion');
    try { if (sessionStorage.getItem('ht-nav')) { document.documentElement.classList.add('veil-on'); sessionStorage.removeItem('ht-nav'); } } catch (e) {}
  }
</script>
